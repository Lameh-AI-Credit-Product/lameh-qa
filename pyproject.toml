[project]
name = "lameh-qa"
version = "0.1.0"
description = ""
authors = [
    {name = "miled",email = "milled@lameh.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "pywin32 (>=312,<313) ; sys_platform == \"win32\"",
    "playwright (>=1.61.0,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "langsmith (>=0.1.0)",
    "requests (>=2.31.0,<3.0.0)",
    "anthropic[bedrock] (>=0.40.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poethepoet (>=0.48.0,<0.49.0)"
]

[tool.poe.tasks]
ratios = "python tests/integration/sector_analysis_ratios.py"
ratios-summary = "python tests/integration/summarize_ratio_failures.py"
download-ratios = "python tests/E2E/sector_analysis_download_company_ratios.py"
ratio-coverage = "python tests/E2E/ratio_coverage.py"
langsmith-build-dataset = "python tests/langsmith/dataset/build_dataset.py"
langsmith-run = "python tests/langsmith/run_eval.py"
langsmith-report = "python tests/langsmith/report/build_report.py"
nuke-charts = "python tests/utils/nuke_charts.py"