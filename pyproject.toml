[project]
name = "lameh-qa"
version = "0.1.0"
description = ""
authors = [
    {name = "miled",email = "milled@lameh.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "pywin32 (>=312,<313) ; sys_platform == \"win32\"",
    "playwright (>=1.61.0,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "langsmith (>=0.1.0)",
    "requests (>=2.31.0,<3.0.0)",
    "anthropic[bedrock] (>=0.40.0,<1.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poethepoet (>=0.48.0,<0.49.0)"
]

[tool.poe.tasks]
sector-analysis-audit = "python tests/sector_analysis_audit.py"
ratios = "python tests/integration/sector_analysis_ratios.py"
ratios-summary = "python tests/integration/summarize_ratio_failures.py"
download-ratios = "python tests/E2E/sector_analysis_download_company_ratios.py"
ratio-coverage = "python tests/coverage/ratio_coverage.py"
ratio-emptiness = "python tests/coverage/ratio_emptiness.py"
# Two eval suites over one shared harness - see tests/langsmith/AGENT.md.
# `fs` grades financial-statement answers, `research` grades board-analysis
# answers; they share the agent client, the judge transport and the report
# renderer, and nothing else.
langsmith-fs-build-dataset = "python tests/langsmith/shared/build_dataset.py --suite fs"
langsmith-fs-run = "python tests/langsmith/fs/run_eval.py"
langsmith-fs-report = "python tests/langsmith/shared/report/build_report.py --suite fs"
langsmith-research-freeze = "python tests/langsmith/research/dataset/freeze_ground_truth.py"
langsmith-research-build-dataset = "python tests/langsmith/shared/build_dataset.py --suite research"
langsmith-research-run = "python tests/langsmith/research/run_eval.py"
langsmith-research-report = "python tests/langsmith/shared/report/build_report.py --suite research"
nuke-charts = "python tests/utils/nuke_charts.py"
perf = "python tests/perf/load_times.py"
perf-compare = "python tests/perf/compare.py"